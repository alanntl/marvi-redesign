# Sveltia CMS. Editors sign in with a GitHub fine-grained personal access
# token (Contents: read/write, this repository only). There is no OAuth app and
# no server anywhere in the flow, which is why the Cloudflare Worker that used
# to sit at sveltia-cms-auth.marvi-groundwater.workers.dev is no longer needed.
#
# auth_methods is not decoration. With neither base_url nor auth_methods,
# Sveltia falls back to Netlify's hosted OAuth client, which cannot work for a
# site published on GitHub Pages — pinning it to [token] removes that path.
#
# GitHub caps fine-grained tokens at about a year. When one expires the CMS
# simply stops saving, with no warning: issue a new one at
# github.com/settings/personal-access-tokens and sign in again.
#
# local_backend / decap-server is deliberately absent — Sveltia ignores it and
# replaces it with "Work with Local Repository" (Chromium, on localhost).
backend:
  name: github
  repo: marvi-groundwater/marvi
  branch: main
  auth_methods: [token]

site_url: https://testpage.marvi.org.in
display_url: https://testpage.marvi.org.in

media_folder: "assets/marvi-originals"
public_folder: "/assets/marvi-originals"

# ---------------------------------------------------------------------------
# One "Pages" collection. Every page on the site — the original sections and
# anything you create — is a file in content/pages/, editable, deletable and
# reorderable here. "Menu order" controls the sidebar; lower numbers sit
# higher. Sort by → Menu order shows the running order.
#
# A page is a header (title, intro, photos) plus content blocks you can add
# and drag to reorder. Different kinds of content are different BLOCK types,
# each showing only its own fields.
#
# Fields marked widget: hidden carry data the site needs but editors never
# touch — most importantly each block's `i18n` map, which links strings to
# their existing translations in 13 languages. Removing a hidden field from
# this file would make the CMS silently delete that data on save.
# ---------------------------------------------------------------------------

collections:
  # ---------------------------------------------------------------------------
  # Site-wide chrome — the things that sit outside any one page. The brand badge
  # is drawn from these two settings rather than being an uploaded image, which
  # is what keeps it sharp at every size and in the site's own colours. Every
  # combination below is the same mark in a different vessel, so none of them
  # can land outside the design.
  # ---------------------------------------------------------------------------
  - name: "site"
    label: "Site-wide"
    files:
      - name: "brandmark"
        label: "Sidebar & logo"
        file: "content/site.json"
        fields:
          - label: "Sidebar brand"
            name: "brand"
            widget: "object"
            collapsed: false
            fields:
              - label: "Logo image (optional)"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload to replace the drawn badge with your own logo. Leave empty to keep the drawing, which stays sharp at every size. A square image works best — the badge is 39px."
              - label: "Logo fit"
                name: "fit"
                widget: "select"
                default: "cover"
                required: false
                hint: "Fill crops to the badge shape; Fit shows the whole logo inside it."
                options:
                  - { label: "Fill the badge", value: "cover" }
                  - { label: "Fit inside the badge", value: "contain" }
              - label: "Name beside the logo"
                name: "wordmark"
                widget: "string"
                required: false
                default: "MARVI"
              - label: "Line under the name"
                name: "tagline"
                widget: "string"
                required: false
                default: "Groundwater · India"
              - label: "Shape"
                name: "shape"
                widget: "select"
                default: "circle"
                hint: "The badge silhouette. It frames an uploaded logo too, not only the drawing."
                options:
                  - { label: "Circle", value: "circle" }
                  - { label: "Rounded square", value: "rounded" }
                  - { label: "Squircle", value: "squircle" }
                  - { label: "Well head (arched top)", value: "wellhead" }
              - label: "Colour"
                name: "tone"
                widget: "select"
                default: "water"
                hint: "Drawn from the site palette, so any pairing with a shape still fits. Ignored once a logo image is uploaded."
                options:
                  - { label: "Water (blue-green)", value: "water" }
                  - { label: "Copper", value: "copper" }
                  - { label: "Chalk (white)", value: "chalk" }
      # The header menu. A page that is not listed here still appears — it
      # joins the first tab's dropdown (or its parent's), so a new page can
      # never become unreachable or stop the site publishing.
      - name: "navigation"
        label: "Header menu"
        file: "content/navigation.json"
        fields:
          - label: "Tabs"
            name: "tabs"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "The menu across the top of every page, left to right. Keep it to about seven tabs."
            fields:
              - { label: "Tab label", name: "label", widget: "string" }
              - label: "Tab opens page"
                name: "page"
                widget: "relation"
                collection: "pages"
                value_field: "slug"
                display_fields: ["menuName"]
                search_fields: ["menuName", "slug"]
              - { label: "Show as the highlighted button", name: "button", widget: "boolean", default: false, required: false, hint: "Use for one tab only — Collaborate with MARVI." }
              - label: "Dropdown items"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - label: "Opens page"
                    name: "page"
                    widget: "relation"
                    collection: "pages"
                    value_field: "slug"
                    display_fields: ["menuName"]
                    search_fields: ["menuName", "slug"]
                    required: false
                  - { label: "Jump to a section of that page", name: "section", widget: "string", required: false, hint: "Optional. The section's address: s- followed by its heading in lower case with dashes, e.g. s-why-groundwater. The build warns if it does not exist." }
                  - { label: "Or open an outside website", name: "url", widget: "string", required: false, hint: "Optional, e.g. https://marvi-groundwater.github.io/OurWater/. Used instead of the page when filled in." }

  - name: "pages"
    label: "Pages"
    label_singular: "page"
    folder: "content/pages"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "menuName"
    slug: "{{fields.slug}}"
    summary: "{{fields.order}} · {{fields.menuName}}"
    sortable_fields:
      - "order"
      - "menuName"
    fields:
      - { label: "Menu name", name: "menuName", widget: "string", hint: "Shown in the site's left-hand menu." }
      - { label: "Page address", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "The web address, e.g. groundwater → /groundwater/. Changing it breaks existing links." }
      - { label: "Menu order", name: "order", widget: "number", value_type: "int", min: 1, default: 99, hint: "Lower numbers appear higher in the menu." }
      - { label: "Show on the site", name: "published", widget: "boolean", default: true, required: false }
      - { label: "Template", name: "template", widget: "hidden", default: "standard" }

      - label: "Title & introduction"
        name: "intro"
        widget: "object"
        collapsed: false
        fields: &introFields
          - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
          - { label: "Title", name: "title", widget: "text", hint: "Line break = where the title wraps to a new line." }
          - { label: "Introduction", name: "lede", widget: "text", hint: "One or two sentences. Also the page's Google description and its preview when shared." }
          - { label: "Eyebrow Text Size (%)", name: "eyebrowSize", widget: "number", default: 100, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Title Size (%)", name: "titleSize", widget: "number", default: 70, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Intro Text Size (%)", name: "ledeSize", widget: "number", default: 100, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Text Alignment", name: "textAlign", widget: "select", default: "left", required: false, options: ["left", "center", "right"] }
          - { label: "Text Position", name: "textPosition", widget: "select", default: "bottom", required: false, options: ["top", "middle", "bottom"] }
          - { label: "Text Block Width (%)", name: "textWidth", widget: "number", default: 100, value_type: "int", min: 30, max: 100, step: 5, required: false }
          - { label: "Text Offset X (%)", name: "textOffsetX", widget: "number", default: 0, value_type: "int", min: -30, max: 30, step: 1, required: false }
          - { label: "Text Offset Y (%)", name: "textOffsetY", widget: "number", default: 0, value_type: "int", min: -30, max: 30, step: 1, required: false }

      - label: "Header photo"
        name: "heroImage"
        widget: "object"
        collapsed: true
        required: false
        fields: &photoFields
          - { label: "Photo", name: "image", widget: "image", required: false }
          - { label: "Description for screen readers", name: "alt", widget: "string", required: false }
          - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
          - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
          - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
          - { label: "Brightness (%)", name: "brightness", widget: "number", default: 100, value_type: "int", min: 20, max: 200, step: 5, required: false, hint: "100 is the photo as taken. Below 100 darkens it — useful when white text sits over a bright header." }
          - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }

      - label: "Menu photo"
        name: "menuImage"
        widget: "object"
        collapsed: true
        required: false
        hint: "Shown on the mobile menu card and when the page is shared. Falls back to the header photo."
        fields: *photoFields

      - label: "Homepage hero (home page only)"
        name: "hero"
        widget: "object"
        collapsed: true
        required: false
        hint: "Only the home page uses this — the big opening screen's small texts and buttons."
        fields:
          - { label: "Corner label", name: "label", widget: "text", required: false }
          - { label: "Bottom-right caption", name: "caption", widget: "text", required: false }
          - { label: "Image area description (screen readers)", name: "stageAlt", widget: "string", required: false }
          - { label: "Photo description (screen readers)", name: "imageAlt", widget: "string", required: false }
          - label: "Buttons"
            name: "actions"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields: &actionFields
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Goes to page (address)", name: "page", widget: "string", hint: "A page address from this site, e.g. approach" }
              - { label: "Filled style", name: "primary", widget: "boolean", default: false, required: false }
          - { label: "i18n", name: "i18n", widget: "hidden", required: false }

      - label: "Content blocks"
        name: "blocks"
        widget: "list"
        label_singular: "block"
        required: false
        typeKey: "type"
        summary: "{{fields.type}}"
        hint: "The page's content, top to bottom. Add blocks and drag to rearrange."
        types:
          # ------------------------------------------------ generic blocks --
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - &tabField
                label: "Tab label"
                name: "tabLabel"
                widget: "string"
                required: false
                hint: "Name a tab here. Two or more blocks side by side that both have one fold into a single tabbed group — and the tab order is the block order, so drag the blocks to reorder the tabs."
              - &visibleField
                label: "Show this block"
                name: "visible"
                widget: "boolean"
                default: true
                required: false
                hint: "Turn off to keep this block (and its tab) off the published site while you work on it."
              - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text", hint: "Use a blank line between paragraphs." }
              - { label: "Text alignment", name: "align", widget: "select", default: "left", required: false, options: ["left", "center", "right"] }
          - label: "Image + text"
            name: "imageText"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
              - { label: "Photo side", name: "photoSide", widget: "select", default: "left", required: false, options: ["left", "right"] }
          - label: "Image gallery"
            name: "gallery"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Photos", name: "photos", widget: "list", fields: *photoFields }
          - label: "Callout / quote"
            name: "callout"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Callout text", name: "body", widget: "text" }
              - { label: "Style", name: "tone", widget: "select", default: "blue", required: false, options: ["blue", "green", "copper"] }
          - label: "Button link"
            name: "button"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Button label", name: "label", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string" }
          - label: "Video"
            name: "video"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Video URL", name: "url", widget: "string", pattern: ['^https?://\S+$', "Must be a full web address starting with https://"], hint: "A YouTube link; the thumbnail is picked up automatically." }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Small label", name: "meta", widget: "string", required: false }
          - label: "Embedded page"
            name: "embed"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "URL to embed", name: "url", widget: "string", pattern: ['^https?://\S+$', "Must be a full web address starting with https://"] }
              - { label: "Title", name: "title", widget: "string", required: false }

          # -------------------------------------------- editorial layouts --
          - label: "Two-column section"
            name: "split"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Left column"
                name: "left"
                widget: "object"
                collapsed: false
                fields: &splitColumn
                  - { label: "Column type", name: "kind", widget: "select", default: "prose", options: [{ label: "Text", value: "prose" }, { label: "Photo", value: "image" }, { label: "Photo with number overlay", value: "dataPanel" }] }
                  - { label: "Opening line (large)", name: "lead", widget: "text", required: false }
                  - { label: "Paragraphs", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                  - label: "Numbered points"
                    name: "features"
                    widget: "list"
                    required: false
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Number", name: "number", widget: "string", required: false, hint: "Blank = automatic (01, 02…)" }
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Text", name: "text", widget: "text", required: false }
                  - { label: "Buttons", name: "actions", widget: "list", required: false, summary: "{{fields.label}}", fields: *actionFields }
                  - { label: "Small logo above the text", name: "logo", widget: "object", collapsed: true, required: false, fields: [{ label: "Image", name: "image", widget: "image", required: false }, { label: "Description", name: "alt", widget: "string", required: false }] }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: true, required: false, fields: *photoFields }
                  - { label: "Overlay number", name: "stat", widget: "string", required: false, hint: "Photo-with-number only." }
                  - { label: "Overlay caption", name: "caption", widget: "string", required: false, hint: "Photo-with-number only." }
                  - { label: "look", name: "look", widget: "hidden", required: false }
              - label: "Right column"
                name: "right"
                widget: "object"
                collapsed: false
                fields: *splitColumn
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Card grid"
            name: "cards"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Corner label", name: "number", widget: "string", required: false, hint: "e.g. A / 01. Blank = automatic." }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          # Two photos, in deliberately unequal slots — the wide one carries
          # the picture, the narrow one answers it. That asymmetry only reads
          # at two, so a third or more switches the row to even columns rather
          # than wrapping into a lopsided grid.
          - label: "Photo pair / row"
            name: "imagePair"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Style", name: "look", widget: "select", default: "editorial", required: false, options: [{ label: "Editorial (with captions)", value: "editorial" }, { label: "App screens", value: "screens" }] }
              - label: "Photos"
                name: "items"
                widget: "list"
                summary: "{{fields.caption}}"
                hint: "Two photos sit in the unequal editorial pair. Three or more become an even row. An entry with no photo chosen is skipped — a caption on its own does not appear."
                fields:
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Photo ribbon (3 across)"
            name: "photoRibbon"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Photos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Dark banner"
            name: "banner"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Small label", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "lede", widget: "text", required: false }
              - { label: "Label colour", name: "accent", widget: "string", required: false, hint: "Kept from the earlier design; the new design does not colour labels." }
              - { label: "Background", name: "tone", widget: "select", required: false, default: "", options: [{ label: "White", value: "" }, { label: "Warm sand", value: "sky" }, { label: "Deep green", value: "deep" }, { label: "Pale copper", value: "sand" }], hint: "Colours this heading and everything below it, up to the next heading. Consecutive headings with the same background share one band." }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Statement with numbers"
            name: "statement"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Small label", name: "label", widget: "string", required: false }
              - { label: "Statement", name: "quote", widget: "text", required: false, hint: "Optional. Leave this and the label empty to show just the numbers under the heading above." }
              - label: "Numbers"
                name: "metrics"
                widget: "list"
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: "Number", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Story cards (with heading)"
            name: "storyCards"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Small label", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string", required: false, hint: "Leave empty when a section heading just above already introduces these cards — they then join that heading's background." }
              - { label: "Text", name: "lede", widget: "text", required: false }
              - { label: "Background", name: "tone", widget: "select", required: false, default: "", options: [{ label: "White", value: "" }, { label: "Warm sand band", value: "sky" }] }
              - { label: "Card style", name: "look", widget: "select", required: false, default: "", options: [{ label: "Photo cards", value: "" }, { label: "Icon cards", value: "icons" }], hint: "Icon cards show each card's icon instead of its photo." }
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Goes to page (address)", name: "page", widget: "string" }
                  - { label: "Small label", name: "label", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Short description", name: "text", widget: "text", required: false }
                  - { label: "Icon", name: "icon", widget: "select", required: false, options: ["approach", "groundwater", "people", "tools", "impact", "knowledge", "news", "collaborate", "water", "game", "video", "publication", "place"], hint: "Shown when the card style is Icon cards, or when a card has no photo." }
                  - { label: "Jump to a section of that page", name: "section", widget: "string", required: false, hint: "Optional, e.g. s-the-marvi-4-s-strategy" }
                  - { label: "Or open an outside website", name: "url", widget: "string", required: false, hint: "Optional. Used instead of the page when filled in." }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Numbered steps"
            name: "steps"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Steps"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Framed screenshot"
            name: "framedShot"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - { label: "Screenshot", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }

          # ------------------------------------------------- list layouts --
          - label: "Media stories (searchable)"
            name: "mediaStories"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Stories"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Source · date", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Link", name: "url", widget: "string" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Film grid"
            name: "filmGrid"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Films"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "YouTube link", name: "url", widget: "string" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Photo archive (filters + lightbox)"
            name: "photoArchive"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Images"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  # Hiding rather than deleting: the entry keeps its title,
                  # category and crop, so putting an image back is one switch
                  # rather than a re-upload and a re-crop.
                  - { label: "Show in the archive", name: "visible", widget: "boolean", default: true, required: false, hint: "Off keeps the image on file but takes it off the page, and out of the count and the filters." }
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                  - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Brightness (%)", name: "brightness", widget: "number", default: 100, value_type: "int", min: 20, max: 200, step: 5, required: false, hint: "100 is the photo as taken. Below 100 darkens it, above 100 lifts it." }
                  - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
                  - { label: "Category", name: "category", widget: "string", hint: "Groups the image under a filter button." }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Source (optional)", name: "source", widget: "string", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          # Publications are ONE list; the headed sections on the page are built
          # from each entry's Kind. Reorder or retitle sections below. A section
          # you set up here stays on the page even while it is empty — its chip
          # reads 0 and it shows its "nothing yet" line — so a kind can be
          # announced before there is anything to put in it. A publication whose
          # Kind matches no section drops into the catch-all rather than vanishing.
          - label: "Publication list (sections + filters)"
            name: "publicationList"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Sections, in page order"
                name: "sections"
                widget: "list"
                required: false
                label_singular: "section"
                summary: "{{fields.title}}"
                hint: "Drag to reorder. A section stays visible while empty, showing its 'nothing yet' line. Leave this list empty to fall back to one section per kind, in the order the publications appear."
                fields:
                  - { label: "Kind", name: "kind", widget: "select", options: &publicationKinds ["Journal article", "Conference paper", "Thesis", "Book", "Brochure", "Report", "Other"], hint: "Collects every publication with this Kind." }
                  - { label: "Heading", name: "title", widget: "string", hint: "Shown above the section and on its filter chip." }
                  - { label: "Note under the heading", name: "note", widget: "text", required: false }
                  - { label: "Line shown while empty", name: "empty", widget: "text", required: false, hint: "Appears only while the section has nothing in it. Leave blank for a generic line." }
              - { label: "\"Show everything\" chip", name: "allLabel", widget: "string", required: false, default: "All" }
              - { label: "Catch-all section heading", name: "otherLabel", widget: "string", required: false, default: "Other outputs", hint: "Where a publication goes when its Kind has no section above." }
              - { label: "Default layout", name: "defaultView", widget: "select", required: false, default: "list", options: [{ label: "List (compact rows)", value: "list" }, { label: "Cards (large tiles)", value: "cards" }], hint: "How the page opens. Readers can switch with the List / Cards buttons." }
              - { label: "Start sections closed", name: "startCollapsed", widget: "boolean", required: false, default: true, hint: "On, the page opens as a list of section headings that readers click to open. Searching opens the sections holding matches either way." }
              - { label: "\"List\" button", name: "listLabel", widget: "string", required: false, default: "List" }
              - { label: "\"Cards\" button", name: "cardsLabel", widget: "string", required: false, default: "Cards" }
              - { label: "Search label", name: "searchLabel", widget: "string", required: false, default: "Search" }
              - { label: "Search placeholder", name: "searchPlaceholder", widget: "string", required: false, hint: "Grey hint text inside the search box. Stays English on translated pages." }
              - { label: "\"Nothing matches\" line", name: "emptyMessage", widget: "string", required: false, default: "No publication matches that", hint: "Shown when a search matches nothing anywhere." }
              - label: "Publications"
                name: "items"
                widget: "list"
                summary: "{{fields.kind}} · {{fields.title}}"
                fields:
                  - { label: "Kind", name: "kind", widget: "select", options: *publicationKinds, hint: "Decides which section this appears under." }
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - label: "Editions"
                    name: "editions"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Language / label", name: "label", widget: "string" }
                      - { label: "Download link", name: "url", widget: "string" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Tool cards"
            name: "toolList"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Tools"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Screenshot", name: "photo", widget: "object", collapsed: true, required: false, fields: *photoFields }
                  - { label: "Button label", name: "linkLabel", widget: "string", required: false }
                  - { label: "Opens page (address)", name: "target", widget: "string", required: false, hint: "A page on this site, e.g. mywell. Leave empty when using an external link." }
                  - { label: "External link", name: "url", widget: "string", required: false, hint: "Wins over the page address if both are set." }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          # One block type for every kind of organisation group — partners,
          # supporters, funders, anything added later. They differ by their tab
          # label and their items, never by their code, so a new category is a
          # new block rather than a new template.
          - label: "Organisation list (partners, supporters, funders…)"
            name: "partnerList"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "How links open"
                name: "linkStyle"
                widget: "select"
                default: "auto"
                required: false
                hint: "A card cannot both be a link and hold links — clicking would be ambiguous — so this picks which. Automatic uses the whole card until an entry has extra links, then switches to buttons."
                options:
                  - { label: "Automatic", value: "auto" }
                  - { label: "Link buttons — small icons under the name", value: "buttons" }
                  - { label: "Direct click — the whole card opens the main link", value: "card" }
              - label: "Show logos"
                name: "logos"
                widget: "boolean"
                default: true
                required: false
                hint: "Off lists this group by name only, even where logos have been uploaded."
              - label: "Organisations"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false, hint: "e.g. Australia · Lead partner" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Main link — clicking the name opens this", name: "url", widget: "string", required: false }
                  - label: "Logo"
                    name: "logo"
                    widget: "object"
                    collapsed: true
                    required: false
                    fields:
                      - { label: "Image", name: "image", widget: "image", required: false }
                      - { label: "Description (screen readers)", name: "alt", widget: "string", required: false, hint: "Blank uses “<name> logo”." }
                  # The main link above is what the name opens. Everything here
                  # is an extra destination the reader can pick instead, one
                  # icon each — so a card can point at a website and offer
                  # LinkedIn beside it without either choice costing the other.
                  - label: "Extra links (icon buttons)"
                    name: "links"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.icon}} · {{fields.url}}"
                    hint: "Each becomes a small round icon under the name, opening in a new tab."
                    fields: &linkFields
                      - label: "Icon"
                        name: "icon"
                        widget: "select"
                        default: "website"
                        options:
                          - { label: "Website", value: "website" }
                          - { label: "LinkedIn", value: "linkedin" }
                          - { label: "Profile page", value: "profile" }
                          - { label: "Email", value: "email" }
                          - { label: "Document / PDF", value: "document" }
                          - { label: "Publications", value: "publication" }
                          - { label: "Video", value: "video" }
                          - { label: "Map / location", value: "location" }
                          - { label: "Other link", value: "link" }
                      # Without the scheme a browser reads the value as a path
                      # on this site, so the link 404s instead of leaving. The
                      # build repairs it now, but it is better caught here,
                      # while the person who knows the intended address is
                      # still looking at the field.
                      - { label: "Link address", name: "url", widget: "string", pattern: ['^(https?://|mailto:|tel:)\S+$', "Must start with https:// (or mailto: / tel:)"], hint: "Full address, e.g. https://www.linkedin.com/in/… — for email, mailto:name@example.org" }
                      - { label: "Label (tooltip)", name: "label", widget: "string", required: false, hint: "Blank uses the icon's own name." }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Portrait band"
            name: "portraitBand"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "How links open"
                name: "linkStyle"
                widget: "select"
                default: "auto"
                required: false
                hint: "A card cannot both be a link and hold links — clicking would be ambiguous — so this picks which. Automatic uses the whole card until an entry has extra links, then switches to buttons."
                options:
                  - { label: "Automatic", value: "auto" }
                  - { label: "Link buttons — small icons under the name", value: "buttons" }
                  - { label: "Direct click — the whole card opens the main link", value: "card" }
              - label: "Filter & sort controls"
                name: "filters"
                widget: "boolean"
                default: true
                required: false
                hint: "Show the affiliation chips, search and sort bar above the portraits."
              - label: "People"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "title", widget: "string", required: false }
                  - { label: "Affiliation", name: "affiliation", widget: "string", required: false }
                  - { label: "Main link — clicking the card opens this", name: "url", widget: "string", required: false, hint: "While there are no extra links below, the whole card opens this. Add extra links and it moves to the person's name, so the icons stay clickable." }
                  - { label: "Extra links (icon buttons)", name: "links", widget: "list", required: false, collapsed: true, summary: "{{fields.icon}} · {{fields.url}}", hint: "LinkedIn, a staff profile, an email — one small icon each, on the card's hover panel.", fields: *linkFields }
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                  - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Source note"
            name: "sourceNote"
            widget: "object"
            fields:
              - *tabField
              - *visibleField
              - label: "Parts"
                name: "parts"
                widget: "list"
                hint: "Text pieces and links, joined in order into one small note."
                fields:
                  - { label: "Text", name: "text", widget: "string", required: false }
                  - { label: "Link", name: "link", widget: "object", collapsed: true, required: false, fields: [{ label: "Label", name: "label", widget: "string", required: false }, { label: "URL", name: "url", widget: "string", required: false }, { label: "Downloads a file", name: "download", widget: "boolean", default: false, required: false }, { label: "Opens in a new tab", name: "external", widget: "boolean", default: false, required: false }] }
              - { label: "style", name: "style", widget: "hidden", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
